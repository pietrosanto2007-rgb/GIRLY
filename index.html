function openOutfitPieceSwapper(combo, weather, occasion){
  const roles = [
    { key:'top', label:'Top', subs:WARDROBE_CATEGORIES.TOP },
    { key:'bottom', label:'Bottom', subs:WARDROBE_CATEGORIES.BOTTOM },
    { key:'shoes', label:'Scarpe', subs:WARDROBE_CATEGORIES.SHOES },
    { key:'bag', label:'Borsa', subs:['Borse'] },
    { key:'accessory', label:'Accessorio', subs:WARDROBE_CATEGORIES.ACCESSORIES.filter(s=>s!=='Borse') },
  ].filter(r=>combo[r.key] !== undefined);

  openModal(`
    ${modalHead('Modifica outfit')}
    <p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;">Tocca un capo per cambiarlo con un\u2019alternativa compatibile.</p>
    <div style="display:flex;flex-direction:column;gap:10px;" id="swapList">
      ${roles.map(r=>{
        const item = combo[r.key];
        if(!item) return '';
        return `<button type="button" class="swap-role" data-role="${r.key}" style="display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--white);cursor:pointer;text-align:left;">
          <div style="width:44px;height:44px;border-radius:10px;background:var(--blush-50);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;" data-imgfor="${item.id}">${ICONS.image}</div>
          <div style="flex:1;"><div style="font-size:13px;font-weight:600;">${escapeHtml(item.name)}</div><div style="font-size:11px;color:var(--ink-faint);">${r.label}</div></div>
          ${ICONS.chevRight}
        </button>`;
      }).join('')}
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Chiudi</button></div>
  `, { onMount: async (overlay)=>{
    for(const r of roles){
      const item = combo[r.key]; if(!item) continue;
      const img = await resolveItemImage(item);
      const box = overlay.querySelector(`[data-imgfor="${item.id}"]`);
      if(box && img) box.innerHTML = `<img src="${img}" style="width:100%;height:100%;object-fit:cover;">`;
    }
    overlay.querySelectorAll('.swap-role').forEach(b=>b.addEventListener('click', ()=>{
      const roleKey = b.getAttribute('data-role');
      const role = roles.find(r=>r.key===roleKey);
      openAlternativesPicker(role, combo, weather, occasion);
    }));
  }});
}

function openAlternativesPicker(role, combo, weather, occasion){
  const band = weatherBandFor(weather.temp);
  const alternatives = STATE.wardrobe.filter(i=>
    role.subs.includes(i.subcategory) &&
    itemMatchesWeather(i, weather, band) &&
    itemMatchesRain(i, weather) &&
    i.id !== combo[role.key]?.id
  );
  openModal(`
    ${modalHead(`Cambia ${role.label.toLowerCase()}`)}
    ${alternatives.length===0 ? `<p style="font-size:13px;color:var(--ink-faint);">Nessuna alternativa compatibile trovata nel tuo armadio.</p>` : `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;" id="altGrid">
      ${alternatives.map(a=>`<button type="button" class="alt-item" data-id="${a.id}" style="border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--white);cursor:pointer;">
        <div data-imgfor="${a.id}" style="aspect-ratio:1;background:var(--blush-50);display:flex;align-items:center;justify-content:center;">${ICONS.image}</div>
        <div style="padding:6px;font-size:11px;font-weight:600;">${escapeHtml(a.name)}</div>
      </button>`).join('')}
    </div>`}
    <div class="modal-foot"><button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Annulla</button></div>
  `, { onMount: async (overlay)=>{
    for(const a of alternatives){
      const img = await resolveItemImage(a);
      const box = overlay.querySelector(`[data-imgfor="${a.id}"]`);
      if(box && img) box.innerHTML = `<img src="${img}" style="width:100%;height:100%;object-fit:cover;">`;
    }
    overlay.querySelectorAll('.alt-item').forEach(b=>b.addEventListener('click', ()=>{
      const newItem = STATE.wardrobe.find(i=>i.id===b.getAttribute('data-id'));
      combo[role.key] = newItem;
      closeModal();
      toast('Outfit aggiornato ✨');
      STATE.outfitCandidates[STATE.outfitSelectedIndex].combo = combo;
      renderOutfitResultModal();
    }));
  }});
}

function saveCurrentOutfit(combo, weather, occasion, silent){
  const items = Object.entries(combo).filter(([k,v])=>v).map(([role,item])=>({ role, itemId:item.id, name:item.name }));
  const outfit = {
    id: uid('outfit'),
    name: `${occasion.label} — ${weather.temp}°C`,
    occasion: occasion.label,
    weather: weatherCodeLabel(weather.code, weather.demo),
    temperature: weather.temp,
    items,
    createdAt: todayISO(),
    favorite:false
  };
  STATE.outfits.unshift(outfit);
  saveOutfits();
  STATE.todayOutfit = { outfitId: outfit.id, date: new Date().toDateString() };
  
  if(!silent){ closeModal(); toast('Outfit salvato ✨'); renderView(); }
  return outfit;
}

function renderRecentWishlist(){

async function renderRecentWardrobe(){
  const slot = document.getElementById('recentWardrobeSlot');
  if(!slot) return;
  const recent = [...STATE.wardrobe].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,4);
  if(recent.length===0){ slot.innerHTML = `<div class="card empty-state" style="padding:30px 16px;"><p class="empty-sub">Ancora nessun capo nell'armadio.</p></div>`; return; }
  slot.innerHTML = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">${recent.map(i=>wardrobeCardSkeleton(i)).join('')}</div>`;
  for(const item of recent){
    const img = await resolveItemImage(item);
    const box = slot.querySelector(`[data-imgfor="${item.id}"]`);
    if(box && img) box.innerHTML = `<img src="${img}" style="width:100%;height:100%;object-fit:cover;">`;
  }
  slot.querySelectorAll('.wardrobe-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const item = STATE.wardrobe.find(i=>i.id===card.getAttribute('data-id'));
      openWardrobeItemModal(item);
    });
  });
}

/* ============================ EXPORT / IMPORT ============================ */
function exportAllData(){
  const payload = {
    profile: STATE.profile, money: STATE.money, wishlist: STATE.wishlist,
    wardrobe: STATE.wardrobe, outfits: STATE.outfits, settings: STATE.settings,
    exportedAt: todayISO(), appName: getAppName(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${getAppName().toLowerCase()}-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Dati esportati ✨');
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.profile) STATE.profile = data.profile;
      if(data.money) STATE.money = data.money;
      if(data.wishlist) STATE.wishlist = data.wishlist;
      if(data.wardrobe) STATE.wardrobe = data.wardrobe;
      if(data.outfits) STATE.outfits = data.outfits;
      if(data.settings) STATE.settings = data.settings;
      await queueStateSave('import');
      toast('Dati importati con successo ✨');
      renderShell(); navigate('home');
    }catch(err){
      console.error(err);
      toast('File non valido: impossibile importare');
    }
  };
  reader.readAsText(file);
}

/* ============================ GLOBAL SEARCH ============================ */
function handleGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return;
  const moneyHits = (STATE.money?.categories||[]).filter(c=>c.name.toLowerCase().includes(q));
  const wishHits = STATE.wishlist.filter(i=>i.name.toLowerCase().includes(q));
  const wardrobeHits = STATE.wardrobe.filter(i=>i.name.toLowerCase().includes(q) || i.color.toLowerCase().includes(q));
  const outfitHits = STATE.outfits.filter(o=>o.items.some(i=>i.name.toLowerCase().includes(q)));
  openGlobalSearchResults(query, { moneyHits, wishHits, wardrobeHits, outfitHits });
}
function openGlobalSearchResults(query, hits){
  const total = hits.moneyHits.length + hits.wishHits.length + hits.wardrobeHits.length + hits.outfitHits.length;
  openModal(`
    ${modalHead(`Risultati per "${escapeHtml(query)}"`)}
    ${total===0 ? `<p style="font-size:13px;color:var(--ink-faint);">Nessun risultato trovato.</p>` : `
      ${hits.moneyHits.length ? `<div class="section-title" style="font-size:13px;">Cartelle Money</div>${hits.moneyHits.map(c=>`<div style="padding:8px 0;font-size:13px;">${escapeHtml(c.name)} · ${euro(c.amount)}</div>`).join('')}` : ''}
      ${hits.wishHits.length ? `<div class="section-title" style="font-size:13px;margin-top:14px;">Wishlist</div>${hits.wishHits.map(i=>`<div style="padding:8px 0;font-size:13px;">${escapeHtml(i.name)}</div>`).join('')}` : ''}
      ${hits.wardrobeHits.length ? `<div class="section-title" style="font-size:13px;margin-top:14px;">Armadio</div>${hits.wardrobeHits.map(i=>`<div style="padding:8px 0;font-size:13px;">${escapeHtml(i.name)}</div>`).join('')}` : ''}
      ${hits.outfitHits.length ? `<div class="section-title" style="font-size:13px;margin-top:14px;">Outfit salvati</div>${hits.outfitHits.map(o=>`<div style="padding:8px 0;font-size:13px;">${escapeHtml(o.name)}</div>`).join('')}` : ''}
    `}
    <div class="modal-foot"><button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Chiudi</button></div>
  `);
}

        <p style="font-size:13px;color:var(--ink-faint);margin-bottom:18px;">Facoltativo: puoi aggiungerlo in qualsiasi momento.</p>
        <div class="field"><input type="number" id="obBalance" placeholder="0,00" step="0.01" min="0" value="${draft.initialBalance}"></div>
        <button class="btn btn-primary" id="obFinish" style="width:100%;margin-top:10px;">Costruiamo il tuo mondo ✨</button>`;
    }
  }

  function bindOnboardingEvents(){
    document.getElementById('obStart')?.addEventListener('click', ()=>{ step=1; render(); });
    document.getElementById('obNext1')?.addEventListener('click', ()=>{
      draft.name = document.getElementById('obName').value.trim();
      step=2; render();
    });
    document.getElementById('obNext2')?.addEventListener('click', ()=>{
      draft.city = document.getElementById('obCity').value.trim() || 'Milano';
      step=3; render();
    });
    document.getElementById('obWeatherYes')?.addEventListener('click', ()=>{ draft.wantsWeather=true; render(); });
    document.getElementById('obWeatherNo')?.addEventListener('click', ()=>{ draft.wantsWeather=false; render(); });
    document.getElementById('obNext3')?.addEventListener('click', ()=>{ step=4; render(); });
    document.getElementById('obFinish')?.addEventListener('click', ()=>{
      draft.initialBalance = document.getElementById('obBalance').value;
      finishOnboarding();
    });
  }

  async function finishOnboarding(){
    try{
      STATE.profile = { name: draft.name || 'Ospite', city: draft.city, onboardingCompleted:true };
      STATE.settings = { ...defaultSettings(), weatherCity: draft.city, weatherDisabled: draft.wantsWeather === false };
      ensureMoney();
      const initial = parseFloat(draft.initialBalance);
      if(initial && initial > 0){
        STATE.money.unallocated += initial;
        STATE.money.total += initial;
        STATE.money.transactions.push({ id:uid('tx'), type:'income', amount:initial, categoryId:null, description:'Saldo iniziale', date: todayISO() });
      }
      markOnboardingCompleted();
      await queueStateSave('onboarding');
      bootApp();
    }catch(e){ console.error(e); toast(`Errore salvataggio: ${e.message||'impossibile completare la configurazione'}`); }
  }

  render();
}

/* ============================ GLOBAL MOBILE INPUT / VIEWPORT ============================ */
/* Gestore delegato: copre automaticamente le viste e le modali presenti o future. */
const MobileInputViewport = (() => {
  const editableSelector = 'input:not([type="hidden"]):not([disabled]):not([readonly]), textarea:not([disabled]):not([readonly]), select:not([disabled]), [contenteditable]:not([contenteditable="false"])';
  const root = document.documentElement;
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  let activeElement = null;
  let animationFrame = 0;
  let stableViewportHeight = Math.max(window.innerHeight, window.visualViewport?.height || 0);

  function isEditable(node){
    return node instanceof Element && node.matches(editableSelector) && node.getClientRects().length > 0;
  }

  function getViewportMetrics(){
    const vv = window.visualViewport;
    const height = Math.round(vv?.height || window.innerHeight);
    const top = Math.max(0, Math.round(vv?.offsetTop || 0));
    return { height, top };
  }

  function updateViewport(){
    const { height, top } = getViewportMetrics();
    if(!activeElement) stableViewportHeight = Math.max(stableViewportHeight, height + top, window.innerHeight);
    const coveredHeight = Math.max(0, stableViewportHeight - height - top);
    const keyboardOpen = !!activeElement && coveredHeight > Math.max(120, stableViewportHeight * .15);

    root.style.setProperty('--app-visual-height', `${height}px`);
    root.style.setProperty('--keyboard-offset', `${keyboardOpen ? Math.round(coveredHeight) : 0}px`);
    document.body.classList.toggle('keyboard-open', keyboardOpen);
  }

  function keepFocusedElementVisible(){
    if(!isEditable(activeElement) || !document.contains(activeElement)) return;
    const { height, top } = getViewportMetrics();
    const rect = activeElement.getBoundingClientRect();
    const safeTop = top + 20;
    const safeBottom = top + height - Math.min(132, Math.max(72, height * .18));

    if(rect.top < safeTop || rect.bottom > safeBottom){
      activeElement.scrollIntoView({
        block:'center',
        inline:'nearest',
        behavior:reducedMotion ? 'auto' : 'smooth'
      });
    }
  }

  function scheduleVisibilityCheck(delay = 0){
    const run = () => {
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(() => {
        updateViewport();
        keepFocusedElementVisible();
      });
    };
    if(delay) window.setTimeout(run, delay);
    else run();
  }

  document.addEventListener('focusin', (event) => {
    if(!isEditable(event.target)) return;
    activeElement = event.target;
    scheduleVisibilityCheck();
    /* iOS e Android aggiornano la visual viewport con tempistiche differenti. */
    scheduleVisibilityCheck(80);
    scheduleVisibilityCheck(320);
  }, true);

  document.addEventListener('focusout', () => {
    window.setTimeout(() => {
      const nextFocused = document.activeElement;
      if(isEditable(nextFocused)){
        activeElement = nextFocused;
        scheduleVisibilityCheck();
        return;
      }
      activeElement = null;
      updateViewport();
    }, 0);
  }, true);

  document.addEventListener('input', (event) => {
    if(event.target === activeElement) scheduleVisibilityCheck();
  }, true);

  const visualViewport = window.visualViewport;
  if(visualViewport){
    visualViewport.addEventListener('resize', () => scheduleVisibilityCheck());
    visualViewport.addEventListener('scroll', updateViewport);
  }
  window.addEventListener('resize', () => scheduleVisibilityCheck());
  window.addEventListener('orientationchange', () => {
    window.setTimeout(() => {
      const { height, top } = getViewportMetrics();
      stableViewportHeight = Math.max(window.innerHeight, height + top);
      scheduleVisibilityCheck();
    }, 180);
  });

  /* Difese aggiuntive per browser mobili che ignorano user-scalable=no. */
  const preventGestureZoom = (event) => event.preventDefault();
  document.addEventListener('gesturestart', preventGestureZoom, { passive:false });
  document.addEventListener('gesturechange', preventGestureZoom, { passive:false });
  document.addEventListener('gestureend', preventGestureZoom, { passive:false });
  document.addEventListener('touchmove', (event) => {
    if(event.touches.length > 1) event.preventDefault();
  }, { passive:false });
  document.addEventListener('dblclick', preventGestureZoom, { passive:false });

  updateViewport();
  return { refresh:scheduleVisibilityCheck };
})();

/* ============================ BOOT ============================ */
function bootApp(){
  if(!STATE.settings) STATE.settings = defaultSettings();
  applyThemeEarly();
  renderShell();
  applyTheme();
  navigate('home');
}
function applyThemeEarly(){
  document.body.classList.toggle('theme-dark', STATE.settings?.theme === 'dark');
}

(async function init(){
  try{
    if(!supabaseConfigIsValid()){
      const localFresh = emptyState();
      STATE.settings = localFresh.settings;
      STATE.profile = localFresh.profile;
      STATE.money = localFresh.money;
      STATE.wishlist = [];
      STATE.wardrobe = [];
      STATE.outfits = [];
      STATE.weatherCache = null;
      renderDatabaseNotConfigured();
      return;
    }
    rebuildSupabaseClient();
    await testSupabaseConnection();
    await loadAllData();
    subscribeToRealtime();
    if(!STATE.profile?.onboardingCompleted){ runOnboarding(); }
    else { bootApp(); }
  }catch(e){
    console.error('GIRLY init error', e);
    renderDatabaseNotConfigured();
    toast(`Supabase non disponibile: ${e.message||'errore di connessione'}`);
  }
})();
</script>
