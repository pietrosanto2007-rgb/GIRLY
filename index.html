<!DOCTYPE html>
<html lang="it">
<head>
<!-- Icona scheda/browser -->
<link rel="icon" type="image/png" href="./apple-touch-icon.png">

<!-- Icona per “Aggiungi a Home” su iPhone/iPad -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<!-- Migliora la resa come Web App su iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GIRLY">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GIRLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --blush-50:  #fdf6f5;
  --blush-100: #fbe9e7;
  --blush-200: #f6d5d2;
  --blush-300: #eebab5;
  --rose-500:  #d97e8e;
  --rose-600:  #c2657b;
  --rose-700:  #a84f68;
  --cream:     #f8f3ec;
  --sand:      #e9ddc9;
  --ink:       #2b2426;
  --ink-soft:  #5c5257;
  --ink-faint: #8c8286;
  --white:     #ffffff;
  --line:      #ecdedb;
  --success:   #6f9c76;
  --danger:    #c1544a;
  --shadow-1: 0 1px 2px rgba(43,36,38,.04), 0 8px 24px -12px rgba(43,36,38,.10);
  --shadow-2: 0 4px 16px rgba(43,36,38,.06), 0 20px 48px -20px rgba(43,36,38,.18);
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 24px;
  --radius-xl:32px;
  --font-display: 'Fraunces', serif;
  --font-body: 'DM Sans', sans-serif;
  --sidebar-w: 248px;
  --header-h: 0px;
  --app-visual-height: 100vh;
  --keyboard-offset: 0px;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
::selection{background:var(--blush-300);color:var(--ink);}
a{color:inherit;}

/* focus visibility */
:focus-visible{outline:2px solid var(--rose-600);outline-offset:2px;border-radius:6px;}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--blush-300);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;min-height:100vh;}

/* ---- Sidebar (desktop) ---- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--white);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:28px 18px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:4px 10px 28px 10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(155deg,var(--rose-500),var(--rose-700));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:600;font-size:17px;
  flex-shrink:0;
}
.brand-name{font-family:var(--font-display);font-size:20px;font-weight:600;}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:12px;
  color:var(--ink-soft);text-decoration:none;
  font-size:14.5px;font-weight:500;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  transition:background .15s ease,color .15s ease;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--blush-100);color:var(--ink);}
.nav-item.active{background:var(--blush-200);color:var(--rose-700);font-weight:600;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
.mini-profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;}
.mini-profile:hover{background:var(--blush-100);}
.mini-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--blush-200);color:var(--rose-700);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;
  font-family:var(--font-display);
  flex-shrink:0;
}
.mini-name{font-size:13.5px;font-weight:600;}
.mini-sub{font-size:12px;color:var(--ink-faint);}

/* ---- Main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:20px 32px;
  position:sticky;top:0;z-index:20;
  background:rgba(248,243,236,.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line);}
.search-wrap{
  flex:1;max-width:420px;
  display:flex;align-items:center;gap:9px;
  background:var(--white);border:1px solid var(--line);
  border-radius:100px;padding:9px 16px;
  color:var(--ink-faint);
}
.search-wrap svg{width:16px;height:16px;flex-shrink:0;}
.search-wrap input{
  border:none;outline:none;background:none;flex:1;
  font-size:13.5px;color:var(--ink);font-family:inherit;
}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--white);border:1px solid var(--line);
  cursor:pointer;color:var(--ink-soft);
  transition:background .15s ease,transform .1s ease;
}
.icon-btn:hover{background:var(--blush-100);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:17px;height:17px;}

.view{padding:8px 32px 100px 32px;max-width:1180px;}
.view[hidden]{display:none;}

/* ---- Bottom nav (mobile) ---- */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:40;
  justify-content:space-around;
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);
  font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:10px;
  flex:1;
}
.bn-item svg{width:21px;height:21px;}
.bn-item.active{color:var(--rose-600);}

/* ============================================================
   GENERIC ELEMENTS
   ============================================================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:18px 0 26px 0;flex-wrap:wrap;}
.page-title{font-size:30px;}
.page-sub{color:var(--ink-faint);font-size:14px;margin-top:4px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:100px;border:none;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:inherit;
  transition:transform .1s ease,background .15s ease,box-shadow .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--rose-600);color:#fff;box-shadow:0 6px 16px -6px rgba(194,101,123,.55);}
.btn-primary:hover{background:var(--rose-700);}
.btn-secondary{background:var(--white);color:var(--ink);border:1px solid var(--line);}
.btn-secondary:hover{background:var(--blush-100);}
.btn-ghost{background:none;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--blush-100);color:var(--ink);}
.btn-danger{background:#fbeceb;color:var(--danger);}
.btn-danger:hover{background:#f6dcda;}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn-icon-only{padding:11px;border-radius:50%;}

.fab{
  position:fixed;right:28px;bottom:28px;z-index:35;
  width:56px;height:56px;border-radius:50%;
  background:var(--rose-600);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px -6px rgba(194,101,123,.6);
  transition:transform .12s ease;
}
.fab:hover{background:var(--rose-700);}
.fab:active{transform:scale(.92);}
.fab svg{width:24px;height:24px;}

.card{
  background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius-l);padding:22px;
  box-shadow:var(--shadow-1);
}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:100px;
  background:var(--blush-100);color:var(--rose-700);
  font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--rose-600);color:#fff;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip-neutral{background:var(--cream);color:var(--ink-soft);}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.badge-success{background:#eaf3ea;color:var(--success);}
.badge-danger{background:#faeae8;color:var(--danger);}
.badge-neutral{background:var(--cream);color:var(--ink-faint);}

.empty-state{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:64px 24px;gap:14px;
}
.empty-icon{
  width:72px;height:72px;border-radius:50%;
  background:var(--blush-100);display:flex;align-items:center;justify-content:center;
  color:var(--rose-500);
}
.empty-icon svg{width:30px;height:30px;}
.empty-title{font-family:var(--font-display);font-size:19px;font-weight:600;}
.empty-sub{color:var(--ink-faint);font-size:13.5px;max-width:320px;line-height:1.5;}

.skeleton{background:linear-gradient(100deg,var(--blush-100) 30%,var(--blush-50) 50%,var(--blush-100) 70%);background-size:220% 100%;animation:shimmer 1.3s ease infinite;border-radius:14px;}
@keyframes shimmer{0%{background-position:120% 0;}100%{background-position:-20% 0;}}

.section-title{font-size:17px;font-weight:600;font-family:var(--font-display);margin-bottom:14px;}

/* ============================================================
   MODAL + TOAST
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(43,36,38,.42);
  backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
@media(min-width:720px){.overlay{align-items:center;}}

.modal{
  background:var(--white);
  width:100%;max-width:520px;
  max-height:92vh;overflow-y:auto;
  border-radius:26px 26px 0 0;
  padding:26px 26px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(24px);
  transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.overlay.open .modal{transform:translateY(0);}
@media(min-width:720px){
  .modal{border-radius:24px;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:19px;}
.modal-close{
  width:32px;height:32px;border-radius:50%;border:none;background:var(--cream);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
}
.modal-close svg{width:15px;height:15px;}
.modal-foot{display:flex;gap:10px;margin-top:22px;}
.modal-foot .btn{flex:1;}

.field{margin-bottom:15px;}
.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field input[type=password],.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--cream);font-size:14px;font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .15s ease,background .15s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose-500);background:var(--white);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.seg{display:flex;background:var(--cream);border-radius:12px;padding:3px;gap:2px;}
.seg button{flex:1;padding:9px;border:none;background:none;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:var(--white);color:var(--rose-700);box-shadow:var(--shadow-1);}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
.opt-btn{
  padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--cream);
  font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-align:center;
}
.opt-btn.active{background:var(--blush-200);border-color:var(--rose-400,#e3a1ac);color:var(--rose-700);}
.color-dot-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;position:relative;}
.color-dot-btn.active{border-color:var(--rose-600);}
.color-dot-btn.active::after{content:'';position:absolute;inset:-5px;border:2px solid var(--rose-600);border-radius:50%;}

.upload-box{
  border:1.5px dashed var(--line);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:26px;cursor:pointer;color:var(--ink-faint);background:var(--cream);text-align:center;
  position:relative;overflow:hidden;
}
.upload-box svg{width:24px;height:24px;}
.upload-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-box span{font-size:12.5px;font-weight:600;position:relative;}

/* toasts */
.toast-stack{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;pointer-events:none;}
@media (max-width:719px){.toast-stack{bottom:90px;}}
.toast{
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:100px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:8px;
  animation:toast-in .25s cubic-bezier(.2,.8,.2,1);
  max-width:88vw;
}
.toast.toast-out{animation:toast-out .2s ease forwards;}
@keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:none;}}
@keyframes toast-out{to{opacity:0;transform:translateY(6px) scale(.96);}}
.toast-dot{width:6px;height:6px;border-radius:50%;background:var(--rose-400,#e3a1ac);flex-shrink:0;}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:980px){
  .sidebar{width:76px;padding:24px 12px;align-items:center;}
  .brand-name,.nav-item span,.mini-name,.mini-sub{display:none;}
  .nav-item{justify-content:center;padding:12px;}
  .brand{justify-content:center;padding-bottom:24px;}
  .mini-profile{justify-content:center;}
}
@media(max-width:719px){
  .sidebar{display:none;}
  .bottom-nav{display:flex;}
  .view{padding:4px 16px 100px 16px;}
  .topbar{padding:16px;}
  .fab{right:18px;bottom:86px;}
  .page-title{font-size:25px;}
}

/* ---- Dark theme override ---- */
body.theme-dark{
  --cream:#211c1e; --white:#2b2426; --ink:#f5eeee; --ink-soft:#cbbec0; --ink-faint:#8f8285;
  --line:#3a3234; --blush-50:#2f2628; --blush-100:#3a2c2f; --blush-200:#4a3438; --blush-300:#5c3d43;
  background:var(--cream);
}
body.theme-dark .search-wrap,body.theme-dark .field input,body.theme-dark .field select,body.theme-dark .field textarea{background:var(--blush-50);}
body.theme-dark .topbar{background:rgba(33,28,30,.86);}

/* ---- Gestione globale viewport mobile, tastiera e zoom ---- */
@supports (height: 100dvh){
  :root{--app-visual-height:100dvh;}
}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  touch-action:pan-x pan-y;
}
body{
  min-height:var(--app-visual-height);
  overscroll-behavior-x:none;
}
#app{min-height:var(--app-visual-height);}
.sidebar{height:var(--app-visual-height);}
.view{padding-bottom:calc(100px + var(--keyboard-offset));}

/* La dimensione dell'overlay segue la visual viewport: le modali restano sopra la tastiera. */
.overlay{
  inset:0 auto auto 0;
  width:100%;
  height:var(--app-visual-height);
  min-height:var(--app-visual-height);
}
.modal{
  max-height:calc(var(--app-visual-height) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overscroll-behavior:contain;
  scroll-padding:24px 0 calc(32px + var(--keyboard-offset)) 0;
}
:where(input, textarea, select, [contenteditable]:not([contenteditable="false"])){
  scroll-margin-top:24px;
  scroll-margin-bottom:calc(132px + var(--keyboard-offset));
}

/* Gli elementi fissi si sollevano con la tastiera e non possono essere coperti dai contenuti ordinari. */
.bottom-nav{bottom:var(--keyboard-offset);}
.toast-stack{bottom:calc(28px + var(--keyboard-offset));}
.fab{
  right:calc(28px + env(safe-area-inset-right));
  bottom:calc(28px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  z-index:80 !important;
  isolation:isolate;
}
@media(max-width:719px){
  .view{padding-bottom:calc(100px + var(--keyboard-offset));}
  .fab{
    right:calc(18px + env(safe-area-inset-right));
    bottom:calc(86px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  }
  /* Evita lo zoom automatico di Safari al focus dei campi. */
  input:not([type="checkbox"]):not([type="radio"]),
  textarea,
  select,
  [contenteditable]:not([contenteditable="false"]){font-size:16px !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================================================================
   GIRLY — single file app
   Sections: CONFIG, STATE, STORAGE, ICONS, UTIL, ROUTER, UI,
   TOAST, MODALS, MONEY, WISHLIST, WARDROBE, WEATHER, OUTFIT ENGINE,
   AI, SETTINGS, EXPORT/IMPORT, SEARCH, ONBOARDING, BOOT
   ================================================================ */

/* ============================ CONFIG ============================ */
const APP_NAME_KEY = 'girly_app_name';
const SUPABASE_CONFIG_KEY = 'girly_supabase_config';
const CONFIG = {
  supabaseUrl: '',
  supabaseKey: '',
  weatherProvider: 'open-meteo',
  weatherApiKey: '',
  aiProvider: 'gemini',
  aiEnabled: false,
  aiApiKey: '',
  weatherCacheMinutes: 45
};

function loadSupabaseConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
    if(saved && typeof saved === 'object'){
      CONFIG.supabaseUrl = saved.url || '';
      CONFIG.supabaseKey = saved.key || '';
    }
  }catch(e){ console.error('Supabase config load error', e); }
}
function saveSupabaseConfig(url, key){
  CONFIG.supabaseUrl = String(url || '').trim().replace(/\/$/, '');
  CONFIG.supabaseKey = String(key || '').trim();
  localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({url:CONFIG.supabaseUrl,key:CONFIG.supabaseKey}));
}
function supabaseConfigIsValid(){
  return /^https:\/\/.+/.test(CONFIG.supabaseUrl) && !!CONFIG.supabaseKey;
}

loadSupabaseConfig();
const { createClient } = window.supabase || {};
let supabaseClient = null;
function rebuildSupabaseClient(){
  if(!createClient || !supabaseConfigIsValid()){ supabaseClient = null; return null; }
  supabaseClient = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  return supabaseClient;
}
rebuildSupabaseClient();

let saveQueue = Promise.resolve();
let realtimeChannel = null;
let realtimeReloadTimer = null;
let remoteReady = false;

function getAppName(){ return STATE.settings?.appName || localStorage.getItem(APP_NAME_KEY) || 'GIRLY'; }
function setAppName(name){
  STATE.settings = STATE.settings || defaultSettings();
  STATE.settings.appName = name || 'GIRLY';
  localStorage.setItem(APP_NAME_KEY, STATE.settings.appName);
  return saveSettings();
}

/* ============================ STATE ============================ */
let STATE = {
  route: 'home',
  profile: null,
  money: null,
  wishlist: [],
  wardrobe: [],
  outfits: [],
  settings: null,
  weatherCache: null,
  wishlistView: 'list',
  wishlistFilter: 'all',
  wishlistSearch: '',
  wishlistCategory: 'all',
  wardrobeFilter: 'all',
  wardrobeSearch: '',

  };

function emptyState(){
  return {
    profile: null,
    money: { id: null, total: 0, unallocated: 0, categories: [], transactions: [] },
    wishlist: [],
    wardrobe: [],
    outfits: [],
    settings: defaultSettings(),
    weatherCache: null,
    todayOutfit: null
  };
}

function normalizeLoadedData(row){
  const base = emptyState();
  const d = row?.data && typeof row.data === 'object' ? row.data : {};
  STATE.profile = d.profile || base.profile;
  STATE.money = d.money || base.money;
  STATE.wishlist = Array.isArray(d.wishlist) ? d.wishlist : [];
  STATE.wardrobe = Array.isArray(d.wardrobe) ? d.wardrobe : [];
  STATE.outfits = Array.isArray(d.outfits) ? d.outfits : [];
  STATE.settings = { ...base.settings, ...(d.settings || {}) };
  STATE.weatherCache = d.weatherCache || null;
  STATE.todayOutfit = d.todayOutfit || null;
  // Compatibilità: elimina eventuali record demo già eventualmente presenti nel payload.
  STATE.wishlist = STATE.wishlist.filter(i => !i?.isDemo);
  STATE.wardrobe = STATE.wardrobe.filter(i => !i?.isDemo);
  if(!STATE.money || typeof STATE.money !== 'object') STATE.money = base.money;
  STATE.money.categories = Array.isArray(STATE.money.categories) ? STATE.money.categories : [];
  STATE.money.transactions = Array.isArray(STATE.money.transactions) ? STATE.money.transactions : [];
}

function buildPersistedPayload(){
  return {
    profile: STATE.profile,
    money: STATE.money,
    wishlist: STATE.wishlist,
    wardrobe: STATE.wardrobe,
    outfits: STATE.outfits,
    settings: STATE.settings,
    weatherCache: STATE.weatherCache,
    todayOutfit: STATE.todayOutfit || null
  };
}

async function testSupabaseConnection(){
  if(!supabaseConfigIsValid()) throw new Error('Inserisci URL e publishable/anon key di Supabase.');
  rebuildSupabaseClient();
  const { error } = await supabaseClient.from('girly_app_data').select('id').eq('id', 1).maybeSingle();
  if(error) throw error;
  return true;
}

async function loadAllData(){
  if(!supabaseClient) throw new Error('SUPABASE_NOT_CONFIGURED');
  const { data, error } = await supabaseClient
    .from('girly_app_data')
    .select('id,data,updated_at')
    .eq('id', 1)
    .maybeSingle();
  if(error) throw error;
  normalizeLoadedData(data);
  remoteReady = true;
  return STATE;
}

function queueStateSave(context='save'){
  if(!supabaseClient) return Promise.reject(new Error('Supabase non configurato. Vai in Impostazioni → Database.'));
  const payload = JSON.parse(JSON.stringify(buildPersistedPayload()));
  saveQueue = saveQueue.then(async ()=>{
    const { error } = await supabaseClient
      .from('girly_app_data')
      .upsert({ id: 1, data: payload, updated_at: new Date().toISOString() }, { onConflict: 'id' });
    if(error) throw error;
    remoteReady = true;
  }).catch(err=>{
    console.error(`Supabase ${context} error`, err);
    toast(`Salvataggio non riuscito: ${err.message || 'errore Supabase'}`);
    throw err;
  });
  return saveQueue;
}

function saveProfile(){ return queueStateSave('profilo'); }
function saveMoney(){ return queueStateSave('money'); }
function saveWishlist(){ return queueStateSave('wishlist'); }
function saveWardrobe(){ return queueStateSave('armadio'); }
function saveOutfits(){ return queueStateSave('outfit'); }
function saveSettings(){ return queueStateSave('impostazioni'); }
function saveWeatherCache(){ return queueStateSave('meteo'); }

async function clearRemoteUserData(){
  if(!supabaseClient) throw new Error('Supabase non configurato.');
  const { error } = await supabaseClient.from('girly_app_data').delete().eq('id', 1);
  if(error) throw error;
  remoteReady = false;
}

function subscribeToRealtime(){
  if(!supabaseClient) return;
  if(realtimeChannel) { try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){} }
  realtimeChannel = supabaseClient.channel('girly-shared-data')
    .on('postgres_changes', { event:'*', schema:'public', table:'girly_app_data' }, ()=>{
      clearTimeout(realtimeReloadTimer);
      realtimeReloadTimer = setTimeout(async ()=>{
        try{
          await loadAllData();
          if(document.getElementById('viewRoot')) { renderShell(); renderView(); applyTheme(); }
        }catch(e){ console.error('Realtime reload error', e); }
      }, 250);
    })
    .subscribe();
}

/* Le immagini vengono memorizzate nel payload Supabase come data URL compresso.
   In questo progetto l'uso è volutamente semplice e senza una seconda infrastruttura. */
async function resolveItemImage(item){
  return item?.imageData || item?.image || null;
}
function compressImageFile(file, maxDim=900, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================ UTILITIES ============================ */
function uid(prefix='id'){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function euro(n){
  const v = Number(n)||0;
  return v.toLocaleString('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });
}
function fmtDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short' });
}
function todayISO(){ return new Date().toISOString(); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function debounce(fn, ms){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function on(root, selector, event, handler){
  root.addEventListener(event, (e)=>{
    const target = e.target.closest(selector);
    if(target && root.contains(target)) handler(e, target);
  });
}

/* ============================ MODAL SYSTEM ============================ */
function openModal(innerHtml, { onMount, size } = {}){
  closeModal(); // ensure single modal
  const overlay = el(`<div class="overlay" id="activeOverlay"><div class="modal" role="dialog" aria-modal="true">${innerHtml}</div></div>`);
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('open'));
  overlay.addEventListener('mousedown', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', escCloseHandler);
  if(onMount) onMount(overlay);
  return overlay;
}
function escCloseHandler(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  const overlay = document.getElementById('activeOverlay');
  if(!overlay) return;
  overlay.classList.remove('open');
  document.removeEventListener('keydown', escCloseHandler);
  setTimeout(()=>overlay.remove(), 180);
}
function modalHead(title){
  return `<div class="modal-head"><h3 class="modal-title">${escapeHtml(title)}</h3><button class="modal-close" onclick="closeModal()">${ICONS.close}</button></div>`;
}
function confirmDialog(title, message, onConfirm, confirmLabel='Elimina'){
  openModal(`
    ${modalHead(title)}
    <p style="font-size:14px;color:var(--ink-soft);line-height:1.55;">${escapeHtml(message)}</p>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-danger" id="confirmBtn">${escapeHtml(confirmLabel)}</button>
    </div>
  `, { onMount:(overlay)=>{
    overlay.querySelector('#confirmBtn').addEventListener('click', ()=>{ onConfirm(); closeModal(); });
  }});
}

        const r = ROUTES.find(x=>x.id===id);
        return `<button class="bn-item" data-route="${id}">${ICONS[r.icon]}<span>${r.label}</span></button>`;
      }).join('')}
    </nav>
  `;
  document.querySelectorAll('[data-route]').forEach(node=>{
    node.addEventListener('click', ()=>navigate(node.getAttribute('data-route')));
  });
  document.getElementById('globalSearch').addEventListener('input', debounce((e)=>{
    handleGlobalSearch(e.target.value);
  }, 220));
  const mainScroller = document.querySelector('.main');
  window.addEventListener('scroll', ()=>{
    document.getElementById('topbar')?.classList.toggle('scrolled', window.scrollY > 4);
  });
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  renderShellActive();
}
function renderShellActive(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.getAttribute('data-route')===STATE.route));
  document.querySelectorAll('.bn-item').forEach(n=>n.classList.toggle('active', n.getAttribute('data-route')===STATE.route));
}
function toggleTheme(){
  STATE.settings.theme = STATE.settings.theme === 'dark' ? 'light' : 'dark';
  saveSettings();
  applyTheme();
  toast(STATE.settings.theme === 'dark' ? 'Tema scuro attivato' : 'Tema chiaro attivato');
}
function applyTheme(){
  document.body.classList.toggle('theme-dark', STATE.settings?.theme === 'dark');
  const btn = document.getElementById('themeToggle');
  if(btn) btn.innerHTML = STATE.settings?.theme === 'dark' ? ICONS.sun : ICONS.cloud;
}

function renderView(){
  const root = document.getElementById('viewRoot');
  const renderers = {
    home: renderHome,
    money: renderMoney,
    wishlist: renderWishlist,
    wardrobe: renderWardrobe,
    outfits: renderSavedOutfits,
    settings: renderSettings
  };
  root.innerHTML = '';
  const fn = renderers[STATE.route] || renderHome;
  fn(root);
  mountFab();
}

function mountFab(){
  const old = document.getElementById('fab');
  if(old) old.remove();
  const map = {
    money: { onClick: openAddTransactionModal, label:'Aggiungi movimento' },
    wishlist: { onClick: openWishlistItemModal, label:'Aggiungi desiderio' },
    wardrobe: { onClick: openWardrobeItemModal, label:'Aggiungi capo' },
  };
  const cfg = map[STATE.route];
  if(!cfg) return;
  const fab = el(`<button class="fab" id="fab" aria-label="${cfg.label}">${ICONS.plus}</button>`);
  fab.addEventListener('click', ()=>cfg.onClick());
  document.body.appendChild(fab);
}

/* ============================ MONEY ============================ */
const FOLDER_ICONS = ['wallet','folder','gift','plane','tag','heart','sparkle','wishlist'];
const FOLDER_COLORS = ['#d97e8e','#c99b6a','#8aab8f','#7fa8c9','#b98cc9','#c2657b','#a8825e','#6fb0a6'];

function ensureMoney(){
  if(!STATE.money){
    STATE.money = { total:0, unallocated:0, categories:[], transactions:[] };
    saveMoney();
  }
}
function moneyUnallocated(){ return STATE.money.unallocated; }
function moneyCategoryById(id){ return STATE.money.categories.find(c=>c.id===id); }
function recalcTotal(){
  const allocated = STATE.money.categories.reduce((s,c)=>s + c.amount, 0);
  STATE.money.total = allocated + STATE.money.unallocated;
}

function renderMoney(root){
  ensureMoney();
  const m = STATE.money;
  const hasData = m.categories.length > 0 || m.total > 0 || m.transactions.length > 0;

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">Money</h1>
        <p class="page-sub">Gestisci i tuoi soldi, in cartelle chiare.</p>
      </div>
      <button class="btn btn-secondary btn-sm" id="btnAddBalance">${ICONS.plus} Aggiungi saldo</button>
    </div>

    ${!hasData ? `
      <div class="card empty-state">
        <div class="empty-icon">${ICONS.wallet}</div>
        <div class="empty-title">Inizia aggiungendo il tuo saldo</div>
        <p class="empty-sub">Registra quanto hai disponibile e crea le tue prime cartelle per organizzarlo.</p>
        <button class="btn btn-primary" id="emptyAddBalance">${ICONS.plus} Aggiungi soldi</button>
      </div>
    ` : `
      <div class="card" style="text-align:center;padding:38px 22px;margin-bottom:22px;background:linear-gradient(165deg,#fff,var(--blush-50));">
        <p style="font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--rose-600);">TOTALE DISPONIBILE</p>
        <div style="font-family:var(--font-display);font-size:52px;font-weight:600;margin-top:6px;line-height:1;">${euro(m.total)}</div>
        <div style="display:flex;justify-content:center;gap:22px;margin-top:18px;color:var(--ink-faint);font-size:12.5px;flex-wrap:wrap;">
          <span><strong style="color:var(--ink);">${m.categories.length}</strong> cartelle</span>
          <span><strong style="color:var(--ink);">${euro(m.unallocated)}</strong> non assegnati</span>
          <span><strong style="color:var(--ink);">${m.transactions.length}</strong> movimenti</span>
        </div>
      </div>

      <div class="section-title">Cartelle</div>
      <div class="money-grid" id="foldersGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:30px;">
        ${m.categories.map(c=>folderCardHtml(c)).join('')}
        <button class="card" id="addFolderCard" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-style:dashed;cursor:pointer;color:var(--ink-faint);min-height:118px;background:transparent;">
          ${ICONS.plus}<span style="font-size:12.5px;font-weight:600;">Nuova cartella</span>
        </button>
      </div>

      ${renderMoneyCharts(m)}

      <div style="display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px 0;">
        <div class="section-title" style="margin-bottom:0;">Storico movimenti</div>
      </div>
      <div class="chip-row" id="historyFilters">
        ${chipBtn('all', STATE.moneyHistoryFilter, 'Tutti')}
        ${chipBtn('income', STATE.moneyHistoryFilter, 'Entrate')}
        ${chipBtn('expense', STATE.moneyHistoryFilter, 'Uscite')}
        ${chipBtn('transfer', STATE.moneyHistoryFilter, 'Trasferimenti')}
      </div>
      <div class="card" style="padding:6px;">
        ${renderTransactionList(m)}
      </div>
    `}
  `;

  document.getElementById('btnAddBalance')?.addEventListener('click', openAddBalanceModal);
  document.getElementById('emptyAddBalance')?.addEventListener('click', openAddBalanceModal);
  document.getElementById('addFolderCard')?.addEventListener('click', ()=>openFolderModal());
  root.querySelectorAll('.folder-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.folder-menu-btn')) return;
      openFolderDetail(card.getAttribute('data-id'));
    });
  });
  root.querySelectorAll('#historyFilters .chip').forEach(c=>{
    c.addEventListener('click', ()=>{ STATE.moneyHistoryFilter = c.getAttribute('data-value'); renderView(); });
  });
}

function chipBtn(value, current, label){
  return `<button class="chip ${value===current?'active':''}" data-value="${value}">${escapeHtml(label)}</button>`;
}

function folderCardHtml(c){
  return `
  <div class="card folder-card" data-id="${c.id}" style="cursor:pointer;padding:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="width:38px;height:38px;border-radius:12px;background:${c.color}22;color:${c.color};display:flex;align-items:center;justify-content:center;">${ICONS[c.icon]||ICONS.folder}</div>
    </div>
    <div style="margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">${escapeHtml(c.name)}</div>
    <div style="font-family:var(--font-display);font-size:21px;font-weight:600;margin-top:2px;">${euro(c.amount)}</div>
  </div>`;
}

function renderTransactionList(m){
  let txs = [...m.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(STATE.moneyHistoryFilter !== 'all') txs = txs.filter(t=>t.type===STATE.moneyHistoryFilter);
  if(txs.length === 0) return `<div class="empty-state" style="padding:40px 20px;"><div class="empty-icon">${ICONS.money}</div><div class="empty-title" style="font-size:15px;">Nessun movimento</div><p class="empty-sub">I movimenti che aggiungi appariranno qui.</p></div>`;
  return txs.map(t=>{
    const cat = moneyCategoryById(t.categoryId);
    const sign = t.type === 'expense' ? '-' : t.type === 'income' ? '+' : '';
    const color = t.type === 'expense' ? 'var(--danger)' : t.type === 'income' ? 'var(--success)' : 'var(--ink)';
    const typeLabel = { income:'Entrata', expense:'Uscita', transfer:'Trasferimento' }[t.type];
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid var(--line);">
      <div style="width:38px;height:38px;border-radius:11px;background:var(--blush-100);color:var(--rose-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${ICONS[cat?.icon]||ICONS.money}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13.5px;font-weight:600;">${escapeHtml(t.description || typeLabel)}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);">${cat ? escapeHtml(cat.name)+' · ' : ''}${fmtDate(t.date)}</div>
      </div>
      <div style="font-weight:700;font-size:14px;color:${color};white-space:nowrap;">${sign}${euro(Math.abs(t.amount))}</div>
    </div>`;
  }).join('');
}

function renderMoneyCharts(m){
  if(m.categories.length === 0) return '';
  const total = m.categories.reduce((s,c)=>s+c.amount,0) || 1;
  let cumulative = 0;
  const stops = m.categories.map(c=>{
    const start = (cumulative/total)*360;
    cumulative += c.amount;
    const end = (cumulative/total)*360;
    return `${c.color} ${start}deg ${end}deg`;
  }).join(', ');
  const income = m.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = m.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const maxIE = Math.max(income, expense, 1);
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;" class="money-charts-grid">
    <div class="card">
      <div class="section-title">Distribuzione per categoria</div>
      <div style="display:flex;align-items:center;gap:22px;">
        <div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:7px;min-width:0;">
          ${m.categories.slice(0,5).map(c=>`
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);">
              <span style="width:9px;height:9px;border-radius:3px;background:${c.color};flex-shrink:0;"></span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(c.name)}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Entrate / Uscite</div>
      <div style="display:flex;align-items:flex-end;gap:26px;height:110px;padding:0 8px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
          <div style="width:100%;max-width:52px;background:var(--success);border-radius:8px 8px 3px 3px;height:${Math.max(6,(income/maxIE)*90)}px;"></div>
          <span style="font-size:11px;color:var(--ink-faint);">Entrate</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
          <div style="width:100%;max-width:52px;background:var(--danger);border-radius:8px 8px 3px 3px;height:${Math.max(6,(expense/maxIE)*90)}px;"></div>
          <span style="font-size:11px;color:var(--ink-faint);">Uscite</span>
        </div>
      </div>
    </div>
  </div>
  <style>@media(max-width:640px){.money-charts-grid{grid-template-columns:1fr !important;}}</style>
  `;
}

function openAddBalanceModal(){
  ensureMoney();
  openModal(`
    ${modalHead('Aggiungi saldo')}
    <p style="font-size:13px;color:var(--ink-faint);margin-bottom:16px;line-height:1.5;">Questo importo va ad aumentare il totale disponibile ed entra nei "Non assegnati", finché non lo sposti in una cartella.</p>
    <div class="field">
      <label class="field-label">Importo</label>
      <input type="number" id="balanceAmount" placeholder="0,00" step="0.01" min="0">
    </div>
    <div class="field">
      <label class="field-label">Descrizione (opzionale)</label>
      <input type="text" id="balanceDesc" placeholder="Es. Stipendio, regalo...">
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" id="confirmBalance">${ICONS.check} Aggiungi</button>
    </div>
  `, { onMount:(overlay)=>{
    overlay.querySelector('#balanceAmount').focus();
    overlay.querySelector('#confirmBalance').addEventListener('click', ()=>{
      const amount = parseFloat(overlay.querySelector('#balanceAmount').value);
      const desc = overlay.querySelector('#balanceDesc').value.trim();
      if(!amount || amount <= 0){ toast('Inserisci un importo valido'); return; }
      STATE.money.unallocated += amount;
      recalcTotal();
      STATE.money.transactions.push({ id:uid('tx'), type:'income', amount, categoryId:null, description: desc || 'Saldo aggiunto', date: todayISO() });
      saveMoney();
      closeModal();
      toast(`${euro(amount)} aggiunti al totale ✨`);
      renderView();
    });
  }});
}

function openFolderModal(existing){
  const isEdit = !!existing;
  let selIcon = existing?.icon || FOLDER_ICONS[0];
  let selColor = existing?.color || FOLDER_COLORS[0];
  openModal(`
    ${modalHead(isEdit ? 'Modifica cartella' : 'Nuova cartella')}
    <div class="field">
      <label class="field-label">Nome</label>
      <input type="text" id="folderName" placeholder="Es. Vinted, Vacanze, Regali..." value="${escapeHtml(existing?.name||'')}">
    </div>
    <div class="field">
      <label class="field-label">Descrizione (opzionale)</label>
      <input type="text" id="folderDesc" value="${escapeHtml(existing?.description||'')}" placeholder="A cosa serve questa cartella">
    </div>
    <div class="field">
      <label class="field-label">Icona</label>
      <div class="opt-grid" id="folderIcons">
        ${FOLDER_ICONS.map(i=>`<button type="button" class="opt-btn icon-opt" data-v="${i}" style="display:flex;align-items:center;justify-content:center;padding:12px;">${ICONS[i]}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="field-label">Colore</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;" id="folderColors">
        ${FOLDER_COLORS.map(c=>`<button type="button" class="color-dot-btn" data-v="${c}" style="background:${c};"></button>`).join('')}
      </div>
    </div>
    ${!isEdit ? `<div class="field">
      <label class="field-label">Importo iniziale (opzionale)</label>
      <input type="number" id="folderInitial" placeholder="0,00" step="0.01" min="0">
      <p style="font-size:11.5px;color:var(--ink-faint);margin-top:6px;">Sposta questo importo dai "Non assegnati" (${euro(moneyUnallocated())} disponibili).</p>
    </div>` : ''}
    <div class="modal-foot">
      ${isEdit ? `<button class="btn btn-danger" id="deleteFolderBtn">${ICONS.trash}</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" id="saveFolderBtn">${ICONS.check} Salva</button>
    </div>
  `, { onMount:(overlay)=>{
    const iconBtns = overlay.querySelectorAll('.icon-opt');
    const colorBtns = overlay.querySelectorAll('.color-dot-btn');
    const syncIcons = ()=>iconBtns.forEach(b=>b.classList.toggle('active', b.getAttribute('data-v')===selIcon));
    const syncColors = ()=>colorBtns.forEach(b=>b.classList.toggle('active', b.getAttribute('data-v')===selColor));
    iconBtns.forEach(b=>b.addEventListener('click', ()=>{ selIcon=b.getAttribute('data-v'); syncIcons(); }));
    colorBtns.forEach(b=>b.addEventListener('click', ()=>{ selColor=b.getAttribute('data-v'); syncColors(); }));
    syncIcons(); syncColors();

    overlay.querySelector('#deleteFolderBtn')?.addEventListener('click', ()=>{
      closeModal();
      confirmDialog('Eliminare cartella?', `I ${euro(existing.amount)} in "${existing.name}" torneranno ai non assegnati.`, ()=>{
        STATE.money.unallocated += existing.amount;
        STATE.money.categories = STATE.money.categories.filter(c=>c.id!==existing.id);
        recalcTotal();
        saveMoney();
        toast('Cartella eliminata');
        navigate('money');
      });
    });

    overlay.querySelector('#saveFolderBtn').addEventListener('click', ()=>{
      const name = overlay.querySelector('#folderName').value.trim();
      const desc = overlay.querySelector('#folderDesc').value.trim();
      if(!name){ toast('Dai un nome alla cartella'); return; }
      if(isEdit){
        existing.name = name; existing.description = desc; existing.icon = selIcon; existing.color = selColor;
        saveMoney();
        toast('Cartella aggiornata');
        closeModal();
        navigate('money');
      } else {
        const initialRaw = overlay.querySelector('#folderInitial')?.value;
        let initial = parseFloat(initialRaw) || 0;
        if(initial > moneyUnallocated()) initial = moneyUnallocated();
        const cat = { id:uid('cat'), name, description:desc, icon:selIcon, color:selColor, amount:initial, createdAt:todayISO() };
        STATE.money.categories.push(cat);
        STATE.money.unallocated -= initial;
        recalcTotal();
        if(initial > 0){
          STATE.money.transactions.push({ id:uid('tx'), type:'transfer', amount:initial, categoryId:cat.id, description:'Fondi iniziali', date: todayISO() });
        }
        saveMoney();
        toast('Cartella creata ✨');
        closeModal();
        renderView();
      }
    });
  }});
}

function openFolderDetail(id){
  const c = moneyCategoryById(id);
  if(!c) return;
  const txs = STATE.money.transactions.filter(t=>t.categoryId===id).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);
  openModal(`
    <div class="modal-head">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;border-radius:12px;background:${c.color}22;color:${c.color};display:flex;align-items:center;justify-content:center;">${ICONS[c.icon]}</div>
        <div>
          <h3 class="modal-title">${escapeHtml(c.name)}</h3>
          ${c.description ? `<p style="font-size:12px;color:var(--ink-faint);">${escapeHtml(c.description)}</p>` : ''}
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">${ICONS.close}</button>
    </div>
    <div style="text-align:center;padding:14px 0 22px 0;">
      <div style="font-family:var(--font-display);font-size:38px;font-weight:600;">${euro(c.amount)}</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="btn btn-secondary btn-sm" style="flex:1;" id="folderAddMoney">${ICONS.plus} Aggiungi</button>
      <button class="btn btn-secondary btn-sm" style="flex:1;" id="folderRemoveMoney">− Rimuovi</button>
      <button class="btn btn-secondary btn-sm" style="flex:1;" id="folderTransfer">${ICONS.swap} Sposta</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span class="section-title" style="margin-bottom:0;font-size:13px;">Ultimi movimenti</span>
      <button class="btn btn-ghost btn-sm" id="folderEditBtn">${ICONS.edit} Modifica</button>
    </div>
    <div>
      ${txs.length ? txs.map(t=>`
        <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
          <span style="color:var(--ink-soft);">${escapeHtml(t.description||'')} · ${fmtDateShort(t.date)}</span>
          <strong style="color:${t.type==='expense'?'var(--danger)':'var(--success)'};">${t.type==='expense'?'-':'+'}${euro(Math.abs(t.amount))}</strong>
        </div>`).join('') : `<p style="font-size:12.5px;color:var(--ink-faint);">Nessun movimento ancora.</p>`}
    </div>
  `, { onMount:(overlay)=>{
    overlay.querySelector('#folderEditBtn').addEventListener('click', ()=>openFolderModal(c));
    overlay.querySelector('#folderAddMoney').addEventListener('click', ()=>openFolderAdjustModal(c, 'add'));
    overlay.querySelector('#folderRemoveMoney').addEventListener('click', ()=>openFolderAdjustModal(c, 'remove'));
    overlay.querySelector('#folderTransfer').addEventListener('click', ()=>openTransferModal(c));
  }});
}

function openFolderAdjustModal(cat, mode){
  const isAdd = mode === 'add';
  openModal(`
    ${modalHead(isAdd ? `Aggiungi a ${cat.name}` : `Rimuovi da ${cat.name}`)}
    <div class="field">
      <label class="field-label">Importo</label>
      <input type="number" id="adjAmount" placeholder="0,00" step="0.01" min="0">
    </div>
    <div class="field">
      <label class="field-label">Descrizione</label>
      <input type="text" id="adjDesc" placeholder="Es. Vendita, regalo, spesa...">
    </div>
    ${!isAdd ? `<p style="font-size:11.5px;color:var(--ink-faint);">Disponibile in cartella: ${euro(cat.amount)}</p>`:''}
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" id="confirmAdj">${ICONS.check} Conferma</button>
    </div>
  `, { onMount:(overlay)=>{
    overlay.querySelector('#adjAmount').focus();
    overlay.querySelector('#confirmAdj').addEventListener('click', ()=>{
      const amount = parseFloat(overlay.querySelector('#adjAmount').value);
      const desc = overlay.querySelector('#adjDesc').value.trim();
      if(!amount || amount<=0){ toast('Inserisci un importo valido'); return; }
      if(isAdd){
        cat.amount += amount;
        STATE.money.unallocated -= amount; // moves from unallocated pool into folder to keep totals consistent
        STATE.money.transactions.push({ id:uid('tx'), type:'income', amount, categoryId:cat.id, description: desc||'Entrata', date: todayISO() });
        toast(`${euro(amount)} aggiunti a ${cat.name}`);
      } else {
        if(amount > cat.amount){ toast('Importo superiore al saldo della cartella'); return; }
        cat.amount -= amount;
        STATE.money.unallocated += amount;
        STATE.money.transactions.push({ id:uid('tx'), type:'expense', amount, categoryId:cat.id, description: desc||'Uscita', date: todayISO() });
        toast(`${euro(amount)} rimossi da ${cat.name}`);
      }
      recalcTotal();
      saveMoney();
      closeModal();
      renderView();
    });
  }});
}

function openTransferModal(fromCat){
  const others = STATE.money.categories.filter(c=>c.id!==fromCat.id);
  openModal(`
    ${modalHead(`Sposta da ${fromCat.name}`)}
    <div class="field">
      <label class="field-label">Verso</label>
      <select id="transferTarget">
        <option value="__unallocated__">Non assegnati</option>
        ${others.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
      </select>
    </div>

      saveMoney();
      closeModal();
      toast(`${euro(amount)} spostati verso ${targetName}`);

    </div>
  `, { onMount:(overlay)=>{
    const seg = overlay.querySelector('#txTypeSeg');
    seg.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
      type = b.getAttribute('data-v');
      seg.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b));
      overlay.querySelector('#txTargetField').style.display = type==='transfer' ? 'block' : 'none';
    }));
    overlay.querySelector('#confirmTx').addEventListener('click', ()=>{
      const amount = parseFloat(overlay.querySelector('#txAmount').value);
      const categoryId = overlay.querySelector('#txCategory').value;
      const desc = overlay.querySelector('#txDesc').value.trim();
      const date = overlay.querySelector('#txDate').value || new Date().toISOString().slice(0,10);
      if(!amount || amount<=0){ toast('Inserisci un importo valido'); return; }
      const cat = moneyCategoryById(categoryId);
      if(type === 'income'){
        cat.amount += amount;
        STATE.money.unallocated -= amount;
      } else if(type === 'expense'){
        if(amount > cat.amount){ toast('Fondi insufficienti in questa cartella'); return; }
        cat.amount -= amount;
        STATE.money.unallocated += amount;
      } else {
        const targetId = overlay.querySelector('#txTarget').value;
        if(amount > cat.amount){ toast('Fondi insufficienti in questa cartella'); return; }
        cat.amount -= amount;
        if(targetId === '__unallocated__') STATE.money.unallocated += amount;
        else moneyCategoryById(targetId).amount += amount;
      }
      recalcTotal();
      STATE.money.transactions.push({ id:uid('tx'), type, amount, categoryId, description: desc, date: new Date(date).toISOString() });
      saveMoney();
      closeModal();
      toast(type==='expense' ? `${euro(amount)} registrati come uscita` : type==='income' ? `${euro(amount)} aggiunti` : 'Trasferimento registrato');
      renderView();
    });
  }});
}

  { cat:'Tecnologia', words:['ipad','iphone','airpods','laptop','computer','tablet','smartwatch','cuffie','macbook','fotocamera','powerbank'] },
  { cat:'Beauty', words:['profumo','parfum','deodorante','shampoo','balsamo','spazzola capelli','piastra','phon'] },
  { cat:'Casa', words:['candela','cuscino','plaid','lampada','decorazione','vaso','tazza'] },

function classifyWishlistItem(name){
  const n = name.toLowerCase();
  for(const entry of KEYWORD_MAP){
    for(const w of entry.words){
      if(n.includes(w)) return entry.cat;
    }
  }
  return 'Altro';
}

function filteredWishlist(){
  let items = [...STATE.wishlist];
  if(STATE.wishlistFilter === 'purchased') items = items.filter(i=>i.purchased);
  if(STATE.wishlistFilter === 'unpurchased') items = items.filter(i=>!i.purchased);
  if(STATE.wishlistSearch.trim()){
    const q = STATE.wishlistSearch.toLowerCase();
    items = items.filter(i=>i.name.toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q) || (i.notes||'').toLowerCase().includes(q));
  }
  return items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

function renderWishlistContent(){
  const container = document.getElementById('wishlistContent');
  if(!container) return;
  const items = filteredWishlist();
  if(items.length === 0){
    container.innerHTML = `<div class="empty-state" style="padding:50px 20px;"><div class="empty-icon">${ICONS.search}</div><div class="empty-title" style="font-size:15px;">Nessun risultato</div><p class="empty-sub">Prova a modificare la ricerca o i filtri.</p></div>`;
    return;
  }
  if(STATE.wishlistView === 'list'){
    container.innerHTML = `<div class="card" style="padding:6px;">${items.map(wishRowHtml).join('')}</div>`;
  } else {
    const grouped = {};
    items.forEach(i=>{ (grouped[i.category] = grouped[i.category]||[]).push(i); });
    container.innerHTML = Object.keys(grouped).sort().map(cat=>`
      <div style="margin-bottom:22px;">
        <div class="section-title" style="font-size:14px;text-transform:none;">${escapeHtml(cat)} <span style="color:var(--ink-faint);font-weight:500;">· ${grouped[cat].length}</span></div>
        <div class="card" style="padding:6px;">${grouped[cat].map(wishRowHtml).join('')}</div>
      </div>
    `).join('');
  }
  bindWishlistRowEvents(container);
}

function bindWishlistRowEvents(container){
  container.querySelectorAll('.wish-check').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const item = STATE.wishlist.find(i=>i.id===b.getAttribute('data-id'));
    item.purchased = !item.purchased;
    saveWishlist();
    toast(item.purchased ? 'Segnato come acquistato ✓' : 'Segnato come non acquistato');
    renderWishlistContent();
    if(document.getElementById('viewRoot')) renderView();
  }));
  container.querySelectorAll('.wish-open').forEach(b=>b.addEventListener('click', ()=>{
    const item = STATE.wishlist.find(i=>i.id===b.getAttribute('data-id'));
    openWishlistItemModal(item);
  }));
  container.querySelectorAll('.wish-delete').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const item = STATE.wishlist.find(i=>i.id===b.getAttribute('data-id'));
    confirmDialog('Eliminare questo desiderio?', `"${item.name}" verrà rimosso dalla wishlist.`, ()=>{
      STATE.wishlist = STATE.wishlist.filter(i=>i.id!==item.id);
      saveWishlist();
      toast('Rimosso dalla wishlist');
      renderView();
    });
  }));
}

function openWishlistItemModal(existing){

  let category = existing?.category || null;
  let priority = existing?.priority || 'Media';
  let imageData = existing?.image || null;

  openModal(`
    ${modalHead(isEdit ? 'Modifica desiderio' : 'Nuovo desiderio')}
    <div class="field">
      <label class="field-label">Nome prodotto</label>

        ${WISHLIST_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Prezzo (opzionale)</label>
        <input type="number" id="wPrice" step="0.01" min="0" value="${existing?.price||''}" placeholder="0,00">

        </select>
      </div>
    </div>
    <div class="field">
      <label class="field-label">Link (opzionale)</label>
      <input type="url" id="wUrl" placeholder="https://..." value="${escapeHtml(existing?.url||'')}">
    </div>
    <div class="field">
      <label class="field-label">Immagine (opzionale)</label>
      <div class="upload-box" id="wImageBox">
        ${imageData ? `<img src="${imageData}">` : `${ICONS.upload}<span>Carica immagine</span>`}
      </div>
      <input type="file" id="wImageInput" accept="image/*" style="display:none;">
    </div>
    <div class="field">
      <label class="field-label">Note (opzionale)</label>
      <textarea id="wNotes" placeholder="Taglia, colore, dettagli...">${escapeHtml(existing?.notes||'')}</textarea>
    </div>
    <div class="field">
      <label class="field-label">Scadenza/evento (opzionale)</label>
      <input type="date" id="wDeadline" value="${existing?.deadline ? existing.deadline.slice(0,10) : ''}">
    </div>

      ${isEdit ? `<button class="btn btn-danger btn-icon-only" id="wDeleteBtn">${ICONS.trash}</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" id="wSaveBtn">${ICONS.check} Salva</button>
    </div>
  `, { onMount:(overlay)=>{
    const nameInput = overlay.querySelector('#wName');
    const catSelect = overlay.querySelector('#wCategory');
    catSelect.value = category || classifyWishlistItem(nameInput.value || '');
    let userPickedCategory = isEdit;
    nameInput.addEventListener('input', debounce(()=>{
      if(userPickedCategory) return;
      catSelect.value = classifyWishlistItem(nameInput.value);
    }, 250));
    catSelect.addEventListener('change', ()=>{ userPickedCategory = true; });
    nameInput.focus();

    const imgBox = overlay.querySelector('#wImageBox');
    const imgInput = overlay.querySelector('#wImageInput');
    imgBox.addEventListener('click', ()=>imgInput.click());
    imgInput.addEventListener('change', async ()=>{
      const file = imgInput.files[0];
      if(!file) return;
      imageData = await compressImageFile(file, 700, 0.82);
      imgBox.innerHTML = `<img src="${imageData}">`;
    });

    overlay.querySelector('#wDeleteBtn')?.addEventListener('click', ()=>{
      closeModal();
      confirmDialog('Eliminare questo desiderio?', `"${existing.name}" verrà rimosso.`, ()=>{
        STATE.wishlist = STATE.wishlist.filter(i=>i.id!==existing.id);
        saveWishlist();
        toast('Rimosso dalla wishlist');
        renderView();
      });
    });

    overlay.querySelector('#wSaveBtn').addEventListener('click', ()=>{
      const name = nameInput.value.trim();
      if(!name){ toast('Inserisci un nome'); return; }
      const data = {
        name,
        category: catSelect.value,
        price: overlay.querySelector('#wPrice').value ? parseFloat(overlay.querySelector('#wPrice').value) : null,
        priority: overlay.querySelector('#wPriority').value,
        url: overlay.querySelector('#wUrl').value.trim(),
        notes: overlay.querySelector('#wNotes').value.trim(),
        deadline: overlay.querySelector('#wDeadline').value ? new Date(overlay.querySelector('#wDeadline').value).toISOString() : null,
        image: imageData
      };
      if(isEdit){
        Object.assign(existing, data);
        toast('Desiderio aggiornato');
      } else {
        STATE.wishlist.push({ id:uid('wish'), purchased:false, createdAt: todayISO(), ...data });
        toast('Aggiunto alla wishlist ✨');
      }
      saveWishlist();
      closeModal();
      renderView();
    });
  }});
}

    `}
  `;
  document.getElementById('emptyAddWardrobe')?.addEventListener('click', ()=>openWardrobeItemModal());

}
function macroLabel(m){
  return { TOP:'Top', BOTTOM:'Bottom', DRESS:'Vestiti', OUTERWEAR:'Outerwear', SHOES:'Scarpe', ACCESSORIES:'Accessori' }[m] || m;
}

function filteredWardrobe(){
  let items = [...STATE.wardrobe];
  if(STATE.wardrobeFilter !== 'all') items = items.filter(i=>macroForSub(i.subcategory)===STATE.wardrobeFilter);
  if(STATE.wardrobeSearch.trim()){
    const q = STATE.wardrobeSearch.toLowerCase();
    items = items.filter(i=>i.name.toLowerCase().includes(q) || (i.color||'').toLowerCase().includes(q) || (i.style||'').toLowerCase().includes(q));
  }
  return items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

async function renderWardrobeGrid(){
  const grid = document.getElementById('wardrobeGrid');
  if(!grid) return;
  const items = filteredWardrobe();
  if(items.length === 0){
    grid.style.display='block';
    grid.innerHTML = `<div class="empty-state" style="padding:40px 20px;"><div class="empty-icon">${ICONS.search}</div><div class="empty-title" style="font-size:15px;">Nessun capo trovato</div></div>`;
    return;
  }
  grid.style.display = 'grid';
  grid.innerHTML = items.map(i=>wardrobeCardSkeleton(i)).join('');
  for(const item of items){
    const img = await resolveItemImage(item);
    const cardImg = grid.querySelector(`[data-imgfor="${item.id}"]`);
    if(cardImg && img) cardImg.innerHTML = `<img src="${img}" alt="${escapeHtml(item.name)}" style="width:100%;height:100%;object-fit:cover;">`;
  }
  grid.querySelectorAll('.wardrobe-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const item = STATE.wardrobe.find(i=>i.id===card.getAttribute('data-id'));
      openWardrobeItemModal(item);
    });
  });
}

async function getWeather(force=false){
  const cache = STATE.weatherCache;
  const cacheValidMs = CONFIG.weatherCacheMinutes * 60 * 1000;
  if(!force && cache && (Date.now() - cache.timestamp) < cacheValidMs){
    return cache.data;
  }
  try{
    const lat = STATE.settings.weatherLat, lon = STATE.settings.weatherLon;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,rain,wind_speed_10m,relative_humidity_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('weather fetch failed');
    const json = await res.json();
    const data = {
      temp: Math.round(json.current.temperature_2m),
      feelsLike: Math.round(json.current.apparent_temperature),
      precipitation: json.current.precipitation,
      rain: json.current.rain,
      wind: Math.round(json.current.wind_speed_10m),
      humidity: json.current.relative_humidity_2m,
      code: json.current.weather_code,
      demo: false,
      city: STATE.settings.weatherCity
    };
    STATE.weatherCache = { data, timestamp: Date.now() };
    saveWeatherCache();
    return data;
  }catch(e){
    console.warn('Weather API unavailable, using demo mode', e);
    const demo = { temp:22, feelsLike:21, precipitation:0, rain:0, wind:9, humidity:55, code:2, demo:true, city: STATE.settings.weatherCity };
    STATE.weatherCache = { data: demo, timestamp: Date.now() };
    saveWeatherCache();
    return demo;
  }
}
function weatherCodeLabel(code, demo){
  if(demo) return 'Parzialmente nuvoloso';
  const map = {
    0:'Sereno',1:'Prevalentemente sereno',2:'Parzialmente nuvoloso',3:'Nuvoloso',
    45:'Nebbia',48:'Nebbia con brina',
    51:'Pioggerella leggera',53:'Pioggerella',55:'Pioggerella intensa',
    61:'Pioggia leggera',63:'Pioggia',65:'Pioggia intensa',
    71:'Neve leggera',73:'Neve',75:'Neve intensa',
    80:'Rovesci leggeri',81:'Rovesci',82:'Rovesci intensi',
    95:'Temporale',96:'Temporale con grandine',99:'Temporale forte'
  };
  return map[code] || 'Variabile';
}
function weatherIsRainy(code){ return [51,53,55,61,63,65,80,81,82,95,96,99].includes(code); }
function weatherIconFor(code, demo){
  if(demo) return ICONS.cloud;
  if(weatherIsRainy(code)) return ICONS.rain;
  if([0,1].includes(code)) return ICONS.sun;
  return ICONS.cloud;
}
async function tryGeolocate(){
  if(!navigator.geolocation) { toast('Geolocalizzazione non disponibile'); return; }
  navigator.geolocation.getCurrentPosition((pos)=>{
    STATE.settings.weatherLat = pos.coords.latitude;
    STATE.settings.weatherLon = pos.coords.longitude;
    STATE.settings.useGeolocation = true;
    saveSettings();
    toast('Posizione aggiornata ✨');
    getWeather(true).then(()=>renderView());
  }, ()=>{ toast('Non è stato possibile ottenere la posizione'); }, { timeout:8000 });
}

/* weather rule engine — modifiable temperature bands */
const WEATHER_BANDS = [
  { max:5,  allow:['Cappotto','Giacca','Stivali','Jeans','Pantaloni','Maglia','Felpa'], avoid:['Shorts','Canotta','Sandali','Crop top'] },
  { max:12, allow:['Giacca','Felpa','Jeans','Pantaloni','Maglia','Sneakers','Stivali'], avoid:['Shorts','Canotta','Sandali'] },
  { max:18, allow:['Maglia','Jeans','Giacca','Camicia','Sneakers','Ballerine'], avoid:['Canotta'] },
  { max:24, allow:['T-shirt','Top','Pantaloni','Shorts','Camicia','Sneakers','Ballerine','Sandali'], avoid:['Cappotto'] },
  { max:30, allow:['Top','T-shirt','Shorts','Gonna','Vestito','Canotta','Sandali'], avoid:['Cappotto','Felpa','Maglia'] },
  { max:99, allow:['Top','T-shirt','Shorts','Canotta','Sandali'], avoid:['Cappotto','Felpa','Maglia','Giacca','Jeans'] },
];
function weatherBandFor(temp){ return WEATHER_BANDS.find(b=>temp <= b.max) || WEATHER_BANDS[WEATHER_BANDS.length-1]; }

/* color compatibility groups */
const NEUTRALS = ['nero','bianco','beige','grigio','marrone'];
const COLOR_COMPAT = {
  nero:['bianco','beige','grigio','rosa','rosso','blu','viola','tutti'],
  bianco:['nero','beige','blu','rosa','azzurro','verde','giallo','marrone','tutti'],
  beige:['nero','bianco','marrone','blu','verde','viola','tutti'],
  grigio:['nero','bianco','rosa','blu','azzurro','viola','tutti'],
  marrone:['beige','bianco','arancione','verde','azzurro'],
  blu:['bianco','beige','grigio','giallo','arancione'],
  azzurro:['bianco','beige','grigio','giallo','marrone'],
  rosa:['bianco','nero','grigio','beige','viola'],
  rosso:['nero','bianco','beige','blu'],
  verde:['bianco','beige','marrone','giallo'],
  giallo:['bianco','blu','nero','azzurro','marrone'],
  arancione:['bianco','blu','marrone','beige'],
  viola:['bianco','nero','grigio','beige','rosa'],
};
function colorCompat(c1, c2){
  if(!c1 || !c2) return 0.6;
  if(c1===c2) return 0.9;
  if(NEUTRALS.includes(c1) || NEUTRALS.includes(c2)) return 0.95;
  if(COLOR_COMPAT[c1]?.includes(c2)) return 0.85;
  return 0.45;
}

function itemMatchesWeather(item, weather, band){
  if(item.minTemp != null && weather.temp < item.minTemp) return false;
  if(item.maxTemp != null && weather.temp > item.maxTemp) return false;
  if(band.avoid.includes(item.subcategory) && item.minTemp == null && item.maxTemp == null) return false;
  return true;
}
function itemMatchesRain(item, weather){
  if(!weatherIsRainy(weather.code)) return true;
  if(['Sandali','Ballerine'].includes(item.subcategory)) return false;
  return true;
}
function itemMatchesSeason(item, weather){
  if(!item.season || item.season.length === 0) return true;
  const month = new Date().getMonth();
  const seasonNow = month<=1||month===11 ? 'inverno' : month<=4 ? 'primavera' : month<=7 ? 'estate' : 'autunno';
  return item.season.includes(seasonNow) || item.season.length >= 3;
}
function itemMatchesFormality(item, occasion){
  const order = { casual:0, smart:1, formal:2 };
  if(!item.formality) return true;
  const diff = Math.abs(order[item.formality] - order[occasion.formality]);
  return diff <= 1;
}

function scoreOutfitCombo(combo, weather, occasion, prefs, band){
  let weatherScore = 0, occasionScore = 0, styleScore = 0, colorScore = 0, categoryScore = 0;
  const pieces = Object.values(combo).filter(Boolean);
  const n = pieces.length || 1;

  pieces.forEach(item=>{
    weatherScore += itemMatchesWeather(item, weather, band) ? 1 : 0.3;
    weatherScore += itemMatchesRain(item, weather) ? 0.3 : 0;
  });
  weatherScore = weatherScore / (n*1.3);

  pieces.forEach(item=>{
    occasionScore += itemMatchesFormality(item, occasion) ? 1 : 0.35;
  });
  occasionScore = occasionScore / n;

  pieces.forEach(item=>{
    if(occasion.styleBoost.includes(item.style)) styleScore += 1;
    else if(prefs.style && item.style === prefs.style) styleScore += 1;
    else styleScore += 0.5;
  });
  styleScore = styleScore / n;
  if(prefs.style && prefs.style !== 'qualsiasi'){
    const matchCount = pieces.filter(p=>p.style===prefs.style).length;
    styleScore = (styleScore + (matchCount/n)) / 2;
  }

  const colors = pieces.map(p=>p.color);
  let pairs = 0, sum = 0;
  for(let i=0;i<colors.length;i++){
    for(let j=i+1;j<colors.length;j++){
      sum += colorCompat(colors[i], colors[j]); pairs++;
    }
  }
  colorScore = pairs ? sum/pairs : 0.7;
  if(prefs.color && prefs.color !== 'qualsiasi'){
    const has = colors.includes(prefs.color);
    colorScore = (colorScore + (has?1:0.5)) / 2;
  }

  const hasTop = !!combo.top, hasBottomOrDress = !!(combo.bottom || combo.dress), hasShoes = !!combo.shoes;
  categoryScore = ((hasTop?1:0)+(hasBottomOrDress?1:0)+(hasShoes?1:0))/3;

  if(prefs.shoes && prefs.shoes !== 'qualsiasi' && combo.shoes){
    if(combo.shoes.subcategory.toLowerCase() !== prefs.shoes) categoryScore *= 0.85;
  }

  const score = weatherScore*0.30 + occasionScore*0.25 + styleScore*0.20 + colorScore*0.15 + categoryScore*0.10;
  return { score, breakdown:{ weatherScore, occasionScore, styleScore, colorScore, categoryScore } };
}

function generateOutfits({ wardrobe, weather, occasion, preferences }){
  const band = weatherBandFor(weather.temp);
  const usable = wardrobe.filter(item=>
    itemMatchesWeather(item, weather, band) &&
    itemMatchesRain(item, weather) &&
    itemMatchesSeason(item, weather)
  );
  const bySub = (subs)=>usable.filter(i=>subs.includes(i.subcategory));

  const tops = bySub(WARDROBE_CATEGORIES.TOP.concat(WARDROBE_CATEGORIES.OUTERWEAR.filter(()=>false)));
  const outerwear = bySub(WARDROBE_CATEGORIES.OUTERWEAR);
  const bottoms = bySub(WARDROBE_CATEGORIES.BOTTOM);
  const dresses = bySub(WARDROBE_CATEGORIES.DRESS);
  const shoesAll = bySub(WARDROBE_CATEGORIES.SHOES);
  const accessories = bySub(WARDROBE_CATEGORIES.ACCESSORIES);
  const bags = accessories.filter(a=>a.subcategory === 'Borse');
  const otherAcc = accessories.filter(a=>a.subcategory !== 'Borse');

  let shoesPool = shoesAll;
  if(preferences.shoes && preferences.shoes !== 'qualsiasi'){
    const preferred = shoesAll.filter(s=>s.subcategory.toLowerCase() === preferences.shoes);
    if(preferred.length) shoesPool = preferred;
  }

  const combos = [];
  const MAX_COMBOS = 60;

  function pushCombo(top, bottom, dress, shoes, bag, accessory){
    if(!shoes) return;
    if(!top && !dress) return;
    if(top && !bottom && !dress) return;
    combos.push({ top: top||null, bottom: bottom||null, dress: dress||null, shoes, bag: bag||null, accessory: accessory||null, outerwear:null });
  }

  // dress-based combos
  dresses.forEach(dress=>{
    shoesPool.forEach(shoes=>{
      const bag = bags[Math.floor(Math.random()*bags.length)] || null;
      const acc = otherAcc[Math.floor(Math.random()*otherAcc.length)] || null;
      pushCombo(null, null, dress, shoes, bag, acc);
    });
  });
  // top+bottom combos
  tops.forEach(top=>{
    bottoms.forEach(bottom=>{
      shoesPool.forEach(shoes=>{
        if(combos.length >= MAX_COMBOS) return;
        const bag = bags[Math.floor(Math.random()*bags.length)] || null;
        const acc = otherAcc[Math.floor(Math.random()*otherAcc.length)] || null;
        pushCombo(top, bottom, null, shoes, bag, acc);
      });
    });
  });

  if(combos.length === 0) return { outfits: [], usableCount: usable.length, reason:'not_enough_items' };

  const scored = combos.map(combo=>{
    const { score, breakdown } = scoreOutfitCombo(combo, weather, occasion, preferences, band);
    return { combo, score, breakdown };
  }).sort((a,b)=>b.score-a.score);

  // de-duplicate very similar outfits (same top+bottom/dress) and take top 3
  const seen = new Set();
  const top3 = [];
  for(const s of scored){
    const key = `${s.combo.top?.id}-${s.combo.bottom?.id}-${s.combo.dress?.id}-${s.combo.shoes?.id}`;
    if(seen.has(key)) continue;
    seen.add(key);
    top3.push(s);
    if(top3.length >= 3) break;
  }

  return { outfits: top3, usableCount: usable.length, reason: null };
}

function outfitExplanation(combo, weather, occasion){
  const parts = [];
  parts.push(`Perfetto per ${weather.temp}°C`);
  parts.push(`ideale per ${occasion.label.toLowerCase()}`);
  const allWardrobe = true;
  parts.push('composto interamente da capi presenti nel tuo armadio');
  return parts.join(', ') + '.';
}

async function runOutfitGeneration(){
  const weather = await getWeather();
  const occasionObj = OCCASIONS.find(o=>o.id===STATE.outfitDraft.occasion) || OCCASIONS[OCCASIONS.length-1];
  const result = generateOutfits({ wardrobe: STATE.wardrobe, weather, occasion: occasionObj, preferences: STATE.outfitDraft });
  if(result.outfits.length === 0){
    toast('Non ci sono abbastanza capi compatibili');
    return;
  }
  STATE.outfitCandidates = result.outfits;
  STATE.outfitSelectedIndex = 0;
  STATE.outfitContext = { weather, occasion: occasionObj };
  renderOutfitResultModal();
}
